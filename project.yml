name: WaterReminder

options:
  bundleIdPrefix: com.aisoftwarely
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  WaterReminder:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaterReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aisoftwarely.waterminder
        PRODUCT_NAME: WaterReminder
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 再来一杯
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  WaterReminder:
    build:
      targets:
        WaterReminder: all
    run:
      config: Debug
    archive:
      config: Release
